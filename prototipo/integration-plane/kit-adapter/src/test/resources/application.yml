spring:
  datasource:
    url: jdbc:h2:mem:kit-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  main:
    banner-mode: off

veriagent:
  home: ${veriagent.home:../..}
  bus:
    type: memory
  security:
    tokens-file: ${java.io.tmpdir}/veriagent-test/demo-tokens-${random.uuid}.json

logging:
  level:
    root: warn
